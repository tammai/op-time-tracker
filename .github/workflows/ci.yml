name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Must stay >= 22.18: `tests/support/electron-mock.ts` is loaded by a
          # bare `require('<path>.ts')` inside `vi.hoisted`, which relies on
          # Node's default TypeScript type stripping. Matches engines.node and
          # release.yml.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test --run
      - name: knowledge validate
        run: node tools/knowledge_validate.mjs